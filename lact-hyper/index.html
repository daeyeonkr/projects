<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>lact-hyper</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>
<main>
  <div class="crumb"><a href="../">Projects</a> / lact-hyper</div>
  <h1>lact-hyper</h1>
  <p class="sub">LaCT의 fast-weight MLP를 gradient 대신 네트워크가 직접 예측한다. 전부 같은 설정으로 20k step 학습 후 평가.</p>
  <div class="wrap">
    <table>
      <thead id="head">
        <tr><th>실험</th><th>뭘 돌렸나</th><th class="num">PSNR 전체</th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="3" class="pending">불러오는 중</td></tr></tbody>
    </table>
  </div>
  <p class="note" id="note"></p>
</main>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data.json?t=' + Math.floor(Date.now() / 60000)).then(r => r.json()).then(d => {
  const done = d.arms.filter(a => a.psnr != null && a.bins && a.bins.length);
  const base = done.find(a => a.base);
  const ref = (base || done[0] || {bins: []}).bins;
  const names = ['조금 겹침', '중간', '많이 겹침'];
  // 열: 전체 PSNR + 입력 두 장이 겹치는 비율 구간별 PSNR
  const val = (a, i) => a.psnr == null || !a.bins ? null : (i < 0 ? a.psnr : a.bins[i].psnr);
  const cols = [-1, ...ref.map((_, i) => i)];
  const best = cols.map(i => Math.max(...done.map(a => val(a, i))));
  document.getElementById('head').innerHTML = '<tr><th>실험</th><th>뭘 돌렸나</th><th class="num">PSNR 전체</th>' +
    ref.map((b, i) => `<th class="num">${names[i] || ''}<br>${b.lo}~${b.hi}</th>`).join('') + '</tr>';
  const cell = (a, i, c) => {
    const v = val(a, i);
    if (v == null) return '<td class="num pending">진행 중</td>';
    const df = base && !a.base ? v - val(base, i) : null;
    const dtxt = df == null ? '' : `<div class="diff">${df >= 0 ? '+' : '\u2212'}${Math.abs(df).toFixed(3)}</div>`;
    return `<td class="num${done.length > 1 && v === best[c] ? ' best' : ''}">${v.toFixed(3)}${dtxt}</td>`;
  };
  document.getElementById('rows').innerHTML = d.arms.map(a => `
    <tr class="${a.base ? 'base' : ''}">
      <td><div class="label">${esc(a.label)}</div><div class="exp">${esc(a.exp)}</div></td>
      <td class="desc">${esc(a.desc)}</td>
      ${cols.map((i, c) => cell(a, i, c)).join('')}
    </tr>`).join('');
  const scenes = done.length ? done[0].scenes : null;
  document.getElementById('note').textContent =
    'RE10K 256×256, 입력 2장과 목표 6장, 12 layer, d 768' +
    (scenes ? `, 평가 scene ${scenes}개` : '') +
    (ref.length ? ` (${ref.map((b, i) => `${names[i]} ${b.n}개`).join(', ')})` : '') +
    (d.updated ? `. 마지막 결과 갱신 ${d.updated}` : '') +
    '. 겹침은 입력 두 장이 서로 겹치는 비율이고 0.05 이하는 scene이 3개뿐이라 뺐다. 값 아래 작은 숫자는 LaCT 원본과의 차이. PSNR은 높을수록 좋고 초록색은 그 칸에서 가장 좋은 값.';
}).catch(() => {
  document.getElementById('rows').innerHTML = '<tr><td colspan="3" class="pending">data.json을 읽지 못했다</td></tr>';
});
</script>
</body>
</html>
